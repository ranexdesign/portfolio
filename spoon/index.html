<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SPOON is a private calorie and training tracker. No account, no ads, no tracking. Metric and imperial.">
<meta name="theme-color" content="#30a46c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<body>
<header id="bar"></header>
<main id="app"></main>
<nav id="nav" aria-label="Main"></nav>
<div id="sheet"></div>
<input type="file" id="pic" accept="image/*" hidden>
<input type="file" id="snap" accept="image/*" capture="environment" hidden>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&window.toast)toast('SPOON was updated. Close and reopen it to use the new version.')});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
